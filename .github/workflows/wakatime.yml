name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天午夜自动运行

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    # 本地修复版 action 需要把更新后的 README 推回 main 分支
    permissions:
      contents: write
    # v1.0.0 修复: 为机器人运行环境设置时区为 UTC+8
    env:
      TZ: 'Asia/Shanghai'
    steps:
      # 使用本地 action 前必须先 checkout 仓库，否则 Runner 找不到 action.yml / Dockerfile
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 本地 action 需要在容器内克隆 username/username 仓库并推送回 main，
          # 所以这里需要检出全部历史（默认 checkout 是浅克隆，可能影响 action 内部的 git 操作）
          fetch-depth: 0

      # 使用本仓库内的修复版 action（去除了跨分支重复统计 commit 的 bug）
      - uses: ./.github/actions/waka-readme-stats-fixed
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # v1.0.0 新增: 自定义更新日期的格式
          UPDATED_DATE_FORMAT: "%Y年%m月%d日 %H:%M:%S UTC+8"
          # --- 以下是保持不变的、用于精简输出的配置 ---
          SHOW_OS: "True"
          SHOW_PROJECTS: "True"
          SHOW_EDITORS: "True"
          SHOW_TIMEZONE: "False" # 我们已经在格式里手动指定了 UTC+8，所以这里关掉，避免重复显示
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_PROFILE_VIEWS: "False"
          # v2.0.0 修复: 使用本地修复版 action 后，跨分支重复计数的 bug 已修复，重新开启 commit 热度统计
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
